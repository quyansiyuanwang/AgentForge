[workspace]
members = ["crates/core", "crates/detectors", "crates/sources"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
jsonschema = { version = "0.33.0", default-features = false }
async-trait = "0.1.89"
futures-util = "0.3.31"
hex = "0.4.3"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["process", "time"] }
toml = "0.9.5"
url = "2.5.4"
