[workspace]
members = ["crates/application", "crates/cli", "crates/compiler", "crates/core", "crates/detectors", "crates/sources", "crates/targets", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
jsonschema = { version = "0.33.0", default-features = false }
async-trait = "0.1.89"
clap = { version = "4.5.46", features = ["derive"] }
futures-util = "0.3.31"
hex = "0.4.3"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
similar = "2.7.0"
thiserror = "2.0.12"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["process", "time", "rt-multi-thread"] }
toml = "1.1.4"
url = "2.5.4"
ratatui = "0.29.0"
crossterm = "0.28.1"
