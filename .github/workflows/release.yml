name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release metadata
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          workspace="$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$version" != "$workspace" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${workspace}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
      - name: CHANGELOG has a section for this version
        run: |
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a '## [${version}]' section"
            exit 1
          fi
      - name: Extract release notes
        run: |
          awk -v version="${version}" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG section for ${version} is empty"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            exe: agentforge.exe
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: agentforge
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe: agentforge
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            exe: agentforge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --package agentforge-cli --target ${{ matrix.target }}
      - name: Smoke test
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/${{ matrix.exe }}" --version
      - name: Archive Unix
        if: runner.os != 'Windows'
        run: tar -czf agentforge-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.exe }}
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.exe }}" -DestinationPath "agentforge-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: agentforge-${{ matrix.name }}
          path: agentforge-${{ matrix.name }}.*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum agentforge-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: dist/release-notes.md
          # Tags such as v0.2.0-rc.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
